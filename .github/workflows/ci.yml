name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Design tokens match DESIGN.md
        run: npm run build:tokens -- --check
      - name: Sourced numbers validate (fails on any unsourced or out-of-order value)
        run: npm run build:data && git diff --exit-code -- public/data src/how/content.generated.html src/hero.generated.html src/hero.generated.css src/question.generated.html src/live.generated.html
      - run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build
      - name: First-screen budget (<= 90 KB gz, no three.js)
        run: npm run check:budget

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone, software WebGL)
        run: npx playwright test
        env:
          CI: true
      - name: Lighthouse (LCP < 2.5 s on throttled mobile)
        run: npx --yes @lhci/cli@0.15 autorun

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  source-data:
    name: Country numbers match the Ember dataset
    # Separate from "test" on purpose: when Ember re-publishes its file this goes red so we update the
    # numbers knowingly (eng review D3), but it never blocks deploying an unrelated fix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the dataset, check sha256 and every country row
        run: npm run check:countries

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare secrets are set
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy."
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=humearth --branch=main
